<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>G11 — Carbon</title>
    <meta name="description" content="Carbon: collaborative note taker" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/carbon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="theme-color" content="#ffffff" />
  </head>
  <body>
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <div id="app">
      <input
        id="sidebar-toggle"
        class="sidebar-toggle"
        type="checkbox"
        aria-label="Toggle sidebar"
      />
      <div id="sidebar">
        <div id="filebar">
          <div id="filebar-buttons">
            <button id="new-file" class="icon-btn">
              <span class="material-symbols-outlined filebar-icon"
                >edit_square</span
              >
            </button>
            <button id="new-file-today" class="icon-btn">
              <span class="material-symbols-outlined toolbar-icon"
                >calendar_today</span
              >
            </button>
            <button id="sort-files" class="icon-btn">
              <span class="material-symbols-outlined filebar-icon">sort</span>
            </button>
          </div>
          <div id="filebar-files"></div>
          <div id="filebar-footer">
            <div id="vault">
              <span class="vault-name">Crea una boveda</span>
            </div>
            <button id="get-vault" class="icon-btn">
              <span class="material-symbols-outlined vault-icon"
                >arrow_downward</span
              >
            </button>
          </div>
        </div>
      </div>
      <div id="editor">
        <div id="editor-header">
          <button
            id="toggle-sidebar"
            class="icon-btn"
            aria-label="Toggle sidebar"
          >
            <span id="toggle-sidebar-icon" class="material-symbols-outlined"
              >left_panel_close</span
            >
          </button>
          <input
            id="note-title"
            class="editable-name inactive"
            type="text"
            value="Nueva pestaña"
            aria-label="Note title"
          />
          <div id="editor-tools">
            <button id="toggle-view" class="icon-btn">
              <span class="material-symbols-outlined">edit</span>
            </button>
            <button id="options" class="icon-btn">
              <span class="material-symbols-outlined">more_vert</span>
            </button>
            <div id="options-menu" class="options-menu" hidden>
              <button id="delete-note" class="options-menu-item">
                <span id="delete-note-icon" class="material-symbols-outlined"
                  >delete</span
                >
                <span id="delete-note-text">Eliminar nota</span>
              </button>
            </div>
          </div>
        </div>
        <div id="editor-content">
          <div
            id="vault-empty"
            class="vault-empty"
            style="
              display: flex;
              flex-direction: column;
              align-items: center;
              justify-content: center;
              height: 100%;
            "
          >
            <img
              id="vault-icon-empty"
              src="/src/assets/carbon.svg"
              alt="Vault icon"
            />
            <div style="margin-bottom: 12px">No se encontro una boveda</div>
            <button id="create-vault" class="text-btn">Crea una boveda</button>
          </div>
          <div id="vault-selected" style="display: none">
            <img
              id="vault-icon-selected"
              src="/src/assets/carbon.svg"
              alt="Vault icon"
            />
            <span id="vault-name-selected-pane" class="vault-name"></span>
            <ul id="recent-notes"></ul>
            <div>
              <button id="new-note-vault" class="text-btn">Nueva nota</button>
              <button id="change-vault" class="text-btn secondary">
                Cambiar boveda
              </button>
            </div>
          </div>
          <div class="pane" id="editor-pane" style="display: none">
            <textarea
              id="editor-input"
              aria-label="Markdown editor"
              placeholder="Write your markdown here..."
            ></textarea>
          </div>
          <div class="pane" id="preview-pane" style="display: none">
            <div id="preview-content"></div>
          </div>
          <label
            id="sidebar-backdrop"
            for="sidebar-toggle"
            aria-hidden="true"
          ></label>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
